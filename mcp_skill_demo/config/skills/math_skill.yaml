# =============================================================================
# 技能定义：math（数学计算）
# -----------------------------------------------------------------------------
# skill 是一份"能力清单"：声明这个技能什么时候触发、依赖哪些 MCP 服务器、
# 以及给 LLM 的系统提示词。运行时由 skill_loader.py 动态加载，
# 新增技能 = 新增一个 yaml 文件，无需改动任何 Python 代码。
# =============================================================================

name: math                                # 技能唯一标识（作为图节点的命名前缀）
description: 数学计算技能，支持加、减、乘、除四则运算

# 触发关键词：用户消息命中任意一个（不区分大小写）即路由到本技能
triggers:
  - 计算
  - 加法
  - 减法
  - 乘法
  - 除法
  - 加上
  - 乘以
  - 数学
  - math
  - add
  - subtract
  - multiply
  - divide
  - calculate

# 依赖的 MCP 服务器：工具装配阶段会从 mcp_servers.yaml 中找到
# 名为 "math" 的服务器，并把这个服务器暴露的所有工具绑定给本技能
mcp_servers:
  - math

# 系统提示词：注入给本技能 Agent 的 LLM
system_prompt: |
  你是一位数学计算助手。当用户提出计算请求时，请使用可用的数学工具
  得出准确结果，并给出简要的计算过程说明。不要凭空计算，优先调用工具。
