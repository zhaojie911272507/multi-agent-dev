# =============================================================================
# 技能定义：weather（天气查询）
# -----------------------------------------------------------------------------
# 与 math_skill.yaml 结构完全一致，只是依赖了不同的 MCP 服务器。
# 注意：两个技能各自绑定自己的工具集，互不干扰 ——
# 这正是"按技能动态组装工具"的核心价值。
# =============================================================================

name: weather
description: 查询指定城市的当前天气情况

triggers:
  - 天气
  - 温度
  - 气温
  - 下雨
  - 晴
  - weather
  - temperature
  - forecast

# 依赖 MCP 服务器：weather 服务器
mcp_servers:
  - weather

system_prompt: |
  你是一位天气助手。请使用天气工具查询用户所问城市的天气，
  并用自然、友好的中文回答，包括天气状况和气温。
  如果用户没有指定城市，请主动询问。
