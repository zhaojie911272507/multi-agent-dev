# =============================================================================
# 技能定义：greeting（打招呼 / 兜底技能）
# -----------------------------------------------------------------------------
# 这个技能演示了"不依赖任何 MCP 服务器"的技能：
# mcp_servers 留空即可，装配阶段不会给它绑定任何工具。
# 同时它充当路由失败时的兜底技能（fallback），
# 保证任何输入都能得到有意义的回答，而不是让图直接报错。
# =============================================================================

name: greeting
description: 打招呼与兜底回复。当用户问好、或无法匹配到其他任何技能时使用。

triggers:
  - 你好
  - 您好
  - 嗨
  - hello
  - hi
  - hey
  - 在吗

# 不依赖任何 MCP 服务器
mcp_servers: []

system_prompt: |
  你是一位友好的智能助手，请用中文简短地与用户打招呼。
  如果用户问的不是打招呼或闲聊，请友好地提示可以尝试的话题，例如：
  数学计算（如"帮我计算 123 * 456"）、天气查询（如"北京天气怎么样"）。
