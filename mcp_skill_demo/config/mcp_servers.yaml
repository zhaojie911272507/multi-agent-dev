# =============================================================================
# MCP 服务器注册表 —— 动态装配的"零件清单"
# -----------------------------------------------------------------------------
# 程序启动时读取本文件，动态连接其中声明的每一个 MCP 服务器，
# 并自动发现每个服务器暴露的工具（tool），不需要写任何硬编码的工具代码。
#
# 支持两种 transport（传输方式）：
#   1. stdio            —— 以子进程方式启动一个本地 Python MCP 服务器
#   2. streamable_http  —— 连接一个远程 HTTP MCP 服务器（如 SSE / HTTP）
#
# 路径占位符：
#   ${DEMO_DIR} 会被自动替换为示例根目录的绝对路径，
#   ${HOME} 等环境变量也可直接用（os.path.expandvars 解析）。
# =============================================================================

servers:
  # -------------------------------------------------------------------------
  # math —— 数学计算服务器（stdio，本地子进程）
  # -------------------------------------------------------------------------
  math:
    command: python                     # 启动命令
    args:                               # 命令行参数（路径支持 ${DEMO_DIR}）
      - "${DEMO_DIR}/servers/math_server.py"
    transport: stdio                    # 子进程标准输入/输出通信

  # -------------------------------------------------------------------------
  # weather —— 天气查询服务器（stdio，本地子进程，内置模拟数据）
  # -------------------------------------------------------------------------
  weather:
    command: python
    args:
      - "${DEMO_DIR}/servers/weather_server.py"
    transport: stdio

  # -------------------------------------------------------------------------
  # 远程 HTTP 服务器示例（默认注释掉）：
  # 若你有远程 MCP 服务，取消注释并在下方填写 url 即可，其他部分无需改动。
  # -------------------------------------------------------------------------
  # remote_example:
  #   url: "http://localhost:8000/mcp/"
  #   transport: "streamable_http"
