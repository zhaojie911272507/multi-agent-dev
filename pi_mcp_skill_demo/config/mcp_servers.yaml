# MCP 服务配置 —— 动态组装的数据源
#
# "动态组装"的第一步：把要连接的 MCP 服务以配置的方式描述出来，
# 代码运行时再逐条读取、创建 stdio 连接、自动发现工具，
# 并把每个工具包装成 Pi 的 AgentTool（工具名 mcp__{name}__{tool}）。
# 新增 / 停用 / 裁剪一个服务，只改这里，无需改任何 Python 代码。
#
# 字段说明：
#   name          客户端名称（拼进工具名：mcp__{name}__{tool}）
#   command       启动服务的命令
#   args          命令行参数；{DEMO_ROOT} 会被替换为本示例目录的绝对路径
#   env           传递给服务子进程的环境变量（可选）
#   enable_tools  只启用其中列出的工具（null 表示全部启用）
#   disable_tools 禁用其中列出的工具（与 enable_tools 二选一使用）

mcp_servers:
  # 计算器服务：4 个工具（add/subtract/multiply/divide）全部启用
  - name: math
    command: python
    args:
      - "{DEMO_ROOT}/servers/math_server.py"
    enable_tools: null

  # 天气服务：只启用 query_weather，动态裁剪掉 get_weather_forecast
  # （工具在运行时发现后按此列表过滤，模型根本看不到被裁剪的工具）
  - name: weather
    command: python
    args:
      - "{DEMO_ROOT}/servers/weather_server.py"
    enable_tools:
      - query_weather
